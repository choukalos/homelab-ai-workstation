# backup.conf — Lego backup configuration (sourced by backup-lib.sh)
#
# The ONE manual step remaining: set LEGO_SHARE to the real SMB share name on
# Lego, put the real password in $CRED_FILE, then run:
#   sudo /home/chuck/homelab/scripts/backup/backup-setup.sh <share-name>

LEGO_HOST="lego.local"
LEGO_IP="192.168.5.100"

# SMB share on Lego (created 2026-09-26). The share is mounted at $MOUNT;
# each host keeps its own subfolder, named after its hostname, so the same
# scripts work unchanged on matrix / thor / any future host.
# On-NAS layout: backup/<host>/{routine,models}/YYYY-MM-DD/
LEGO_SHARE="backup"

MOUNT="/mnt/lego"
HOST_DIR="$(cat /etc/hostname 2>/dev/null || hostname)"   # matrix here; thor on thor — per-host subfolder
BACKUP_ROOT="$MOUNT/$HOST_DIR"

# CIFS credentials (chmod 600). Used by the fstab entry (systemd automounts).
# Absolute path on purpose: $HOME would be /root when setup runs as root.
CRED_FILE="/home/chuck/.smbcredentials"

# The fstab mount is performed by systemd as root; make every file on the
# mount appear owned by the backup user so rsync (run as that user) can
# read/write it. (cifs uid=/gid= mount options)
MOUNT_UID="$(id -u chuck 2>/dev/null || id -u)"
MOUNT_GID="$(id -g chuck 2>/dev/null || id -g)"

# Source root that snapshots mirror (snapshot paths are relative to this).
DATA_ROOT="/home/chuck/data"

# State + logging (not on the NAS, survives NAS outage).
STATE_DIR="$HOME/.local/state/backup"
LOG_FILE="$STATE_DIR/backup.log"

# Retention: how many dated snapshots to keep per track.
ROUTINE_KEEP=4      # ~4 weeks of weekly snapshots (plan: "keep 4")
MODELS_KEEP=2       # current + previous model set

# Pre-run free-space guards (GB) on the NAS.
ROUTINE_MIN_FREE_GB=5
MODELS_MIN_FREE_GB=120   # ~110 GB model set + headroom