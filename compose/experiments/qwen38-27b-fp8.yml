# Experiment: Qwen3.8-27B FP8 — 128K context, 3 concurrent seqs, vision + MTP
# Model: Qwen/Qwen3.8-27B-FP8 (official Qwen FP8 quantization)
#
# Architecture: 27B dense hybrid — 48/64 layers Gated-DeltaNet (linear attention)
#              + 16/64 layers Gated Attention (full KV)
# - Vision tower: native image + video understanding
# - MTP: Multi-Token Prediction for decode speedup
# - Hybrid: GDN (48 V heads, 16 QK, head_dim=128) + Gated Attn (24 Q, 4 KV, head_dim=256)
# - FFN intermediate: 17,408
# - Thinking mode with reasoning_effort control + preserve_thinking
# - Tool calling via qwen3_coder (XML-style, auto-parsed by server)
#
# VRAM Budget (72GB RTX PRO 5000, Blackwell, 0.92 util):
#   FP8 weights (27B):              ~28 GB
#   Activations + overhead (0.92):  ~6-7 GB
#   Remaining for KV cache:         ~37-38 GB
#   KV @ 128K context (FP8):        ~1.2 GB per sequence
#   → 3 sequences ≈ 3.6GB KV + headroom for long prompts
#   → Comfortable fit with ~10GB spare for activation spikes
#
# Features enabled:
#   - FP8 KV cache: halves KV memory vs BF16, enabling longer context
#   - MTP (3 speculative tokens): ~1.3-1.5x decode throughput
#   - Prefix caching: reuses KV for shared prefixes
#   - Chunked prefill: avoids OOM during long prompt processing
#   - Vision: native image + video via Qwen3_5ForConditionalGeneration
#   - Tool calling: qwen3_coder parser + enable_auto_tool_choice
#   - Thinking control: reasoning_effort (xhigh/medium/low), preserve_thinking
#
# Sampling params (per model card):
#   Thinking mode: temp=1.0, top_p=0.95, top_k=20, min_p=0.0
#   Instruct mode: temp=0.7, top_p=0.80, top_k=20, presence_penalty=1.5
#
# ⚠️  Requires vLLM 0.17.0+ for Qwen3.8 hybrid GDN + vision support
#     Uses vLLM 0.17.0 image — if unavailable, build from source

services:
  # Model is pre-cached at /home/chuck/data/models/hub/models--Qwen--Qwen3.8-27B-FP8
  # (29GB, all 81 files). Boot now resolves config from cache, no HuggingFace
  # network needed — same as qwen38-nvfp4. A transient DNS blip during the first
  # (uncached) download is what caused the original failure.
  qwen38-fp8:
    image: vllm/vllm-openai:v0.21.0-cu129-ubuntu2404
    container_name: qwen38-fp8
    restart: "on-failure"
    ipc: host
    shm_size: "16gb"
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/data/models
      - HF_TOKEN=${HF_TOKEN}
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_HUB_OFFLINE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - /home/chuck/data/models:/data/models
      - /home/chuck/homelab/scripts/templates:/templates:ro
    command: >
      --model Qwen/Qwen3.8-27B-FP8
      --served-model-name qwen38-27b
      --host 0.0.0.0
      --port 8000
      --max-model-len 131072
      --max-num-seqs 3
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.92
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --enable-chunked-prefill
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --limit-mm-per-prompt '{"image": 5, "video": 2}'
      --default-chat-template-kwargs '{"enable_thinking":true,"preserve_thinking":true}'
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
