# ComfyUI — GPU 1 (RTX 4000 Blackwell, 24 GB) — media pipeline dedicated card
# ACTIVE since Phase 1 (2026-11-14). The pre-Phase-1 GPU 0 variant (shared 72 GB
# card, `--reserve-vram 60`, count: 1) is archived at
# compose/legacy/compose.comfyui-gpu0.yml — used by the `legacy-daily` mode
# (Phase 3). Mutually exclusive with that legacy file: only ONE of the two should
# be up at a time (same container_name comfyui_backend + port 8188).
#
# Differences vs the legacy GPU 0 variant:
#   - device_ids: ['1'] — pin to GPU 1.
#   - Removed `--reserve-vram 60` (that reserved VRAM for vLLM on the shared 72 GB
#     card). GPU 1 is dedicated, so ComfyUI may use the full 24 GB. The Ollama
#     copywriter is the only co-tenant and unloads on idle (OLLAMA_KEEP_ALIVE=5m);
#     conflicts are handled by the media headroom guard (add_card_plan.md §4.1.4).
#
# Usage: docker compose -f compose/comfyui-gpu1.yml --profile image up -d

services:
  comfyui:
    image: mmartial/comfyui-nvidia-docker:latest
    container_name: comfyui_backend
    restart: unless-stopped
    profiles: ["image"]
    ports:
      - "8188:8188"
    shm_size: "4gb"
    environment:
      - COMFYUI_FLAGS=--listen 0.0.0.0 --port 8188 --fp16-vae
      - CUDA_MALLOC_ASYNC=1
      - SECURITY_LEVEL=weak
      - USE_SOCAT=false
      - USE_UV=true
      - BASE_DIRECTORY=/basedir
    volumes:
      - /home/chuck/data/comfyui/run:/comfy/mnt
      - /home/chuck/data/comfyui/basedir:/basedir
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  # media-pipeline — unchanged from compose/comfyui.yml (CPU-only orchestrator, no GPU
  # reservation). Host networking reaches ComfyUI 127.0.0.1:8188 + VLLM 127.0.0.1:8000
  # on the host loopback. Started/stopped as a unit with ComfyUI (same profile "image").
  # Rebuild after code changes: model-manager rebuild media-pipeline
  media-pipeline:
    build:
      context: ../media-pipeline
      dockerfile: Dockerfile
    image: media-pipeline:latest
    container_name: media_pipeline
    restart: unless-stopped
    profiles: ["image"]
    network_mode: host
    environment:
      # Phase 17 (2026-11-26, post-P12-A): LAN-only bind. Public file routes
      # now relay via mcp_filebridge on thor (ai-net), so 8189 no longer needs
      # a public bind. Runbook: homelab-ai-harness docs/thor_manual_tasks.md
      # Phase 17. Rollback: set back to 0.0.0.0 + up -d media-pipeline.
      - PIPELINE_HOST=192.168.4.55
      - PIPELINE_PORT=8189
      # Phase 6 quant decision (2026-11-22): Q8_0 promoted — best quality at
      # 720p (vision-subagent compare vs Q5_K_M baseline: sharper face/fur,
      # cleaner edges, no artifacts) at ~baseline VRAM (19,577 MiB peak,
      # 4.9 GB headroom). Q6_K ≈ similar but Q8_0 consistently ahead; FP8
      # was faster (43.9 min vs ~57 min) and lighter (17.6 GB) but showed
      # dark-bg banding on one frame — rejected on quality. To fall back:
      # set the *_MODEL lines to the Q5_K_M pair + WAN_METERING_LABEL to
      # wan2.2-14b-i2v-gguf-q5 (loser models Q6_K/FP8 deleted post-decision;
      # Q5_K_M pair kept). Files in
      # /home/chuck/data/comfyui/basedir/models/diffusion_models/.
      - WAN_HIGHNOISE_MODEL=Wan2.2-I2V-A14B-HighNoise-Q8_0.gguf
      - WAN_LOWNOISE_MODEL=Wan2.2-I2V-A14B-LowNoise-Q8_0.gguf
      - WAN_UNET_LOADER=gguf
      - WAN_T5_DEVICE=cpu
      - WAN_METERING_LABEL=wan2.2-14b-i2v-gguf-q8
      # After changing: docker compose -f compose/comfyui.yml --profile image up -d
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/chuck/data/comfyui/run:/home/chuck/data/comfyui/run
      - /home/chuck/data/comfyui/basedir:/home/chuck/data/comfyui/basedir
      - /home/chuck/homelab/.env:/home/chuck/homelab/.env:ro