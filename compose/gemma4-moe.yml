# Ollama — GPU 1 (RTX 4000 Blackwell, 24 GB) — COPYWRITER (Gemma 4 31B)
#
# ACTIVE since Phase 1 (2026-11-14). The pre-Phase-1 GPU 0 variant (count: 1,
# shared 72 GB card) is archived at compose/legacy/compose.gemma4-moe-gpu0.yml —
# used by the `legacy-daily` mode (Phase 3). Mutually exclusive with that legacy
# file: same container_name (ollama) + port (11434). Only ONE of the two up at a
# time.
#
# Differences vs the legacy GPU 0 variant:
#   - device_ids: ['1'] — pin to GPU 1 (the 24 GB card).
#   - Copywriter = gemma4:31b (20.4 GB: 18.7 model + 1.2 vision + 0.5 draft/speculative).
#     Gemma 4's KV cache is tiny (~4 MiB/1K tokens): 64K ctx ≈ 22.1 GB total on the
#     24 GB card (~2.3 GB headroom, measured 2026-11-21); 128K verified loadable.
#     gemma4:26b (17 GB MoE) remains available as the fast option.
#   - OLLAMA_KEEP_ALIVE=5m (unchanged) — idle-unload frees VRAM for the media pipeline
#     (the swap mechanism, add_card_plan.md §4.1.4).
#
# Usage: docker compose -f compose/ollama-gpu1.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_MAX_QUEUE=8
    volumes:
      - /home/chuck/data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]