# Ollama — GPU 1 (RTX 4000 Blackwell, 24 GB) variant — COPYWRITER (Gemma 4 31B)
#
# DRAFT (add_card_plan.md Phase 0a) — NOT yet applied. Becomes the active Ollama
# compose after the 2nd card is installed (Phase 1).
#
# Mutually exclusive with compose/gemma4-moe.yml (GPU 0 / legacy-daily): same
# container_name (ollama) + port (11434). Only ONE of the two up at a time.
#
# Differences vs compose/gemma4-moe.yml (GPU 0):
#   - device_ids: ['1'] — pin to GPU 1 (the 24 GB card).
#   - Copywriter = gemma4:31b (20.4 GB: 18.7 model + 1.2 vision + 0.5 draft/speculative).
#     Fits the 24 GB card with ~3.6 GB for context (8–16K comfortable, 32K tight).
#     gemma4:26b (17 GB MoE) remains available as the fast option.
#   - OLLAMA_KEEP_ALIVE=5m (unchanged) — idle-unload frees VRAM for the media pipeline
#     (the swap mechanism, add_card_plan.md §4.1.4).
#
# Usage: docker compose -f compose/ollama-gpu1.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_MAX_QUEUE=8
    volumes:
      - /home/chuck/data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]