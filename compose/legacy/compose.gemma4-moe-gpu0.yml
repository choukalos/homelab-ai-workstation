# ARCHIVED (Phase 1, 2026-11-14) — pre-Phase-1 GPU 0 Ollama compose (count: 1,
# shared 72 GB card). Kept for the `legacy-daily` rollback mode
# (add_card_plan.md §4.1.1, Phase 3). The active Ollama compose is
# compose/gemma4-moe.yml (GPU 1, device_ids ['1']).
# Ollama — Gemma4 26B MoE + nomic-embed-text
# Serves: matrix-gemma4-moe (gemma4:26b) and embeddings (nomic-embed-text)
# Usage: docker compose -f compose/draft/gemma4-moe.yml up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_MAX_QUEUE=8
    volumes:
      - /home/chuck/data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
