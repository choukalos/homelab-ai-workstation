# ollama-copywriter-gpu1 — Ollama copywriter (Gemma 4 31B) pinned to GPU 1
# Status: ACTIVE (wired into the `daily` mode in Phase 3, 2026-11-21). The compose it
# points at (compose/gemma4-moe.yml) has been the ACTIVE GPU 1 Ollama compose since
# Phase 1 (2026-11-14). The copywriter runs on GPU 1 (dedicated 24 GB) instead of
# GPU 0 (shared, 14 GB slot).

name: ollama-copywriter-gpu1
alias: matrix-copywriter  # NEW LiteLLM alias (Phase 3/4 adds the Thor entry)
backend: ollama
status: active

model:
  path: gemma4:31b
  quantization: "Q4_K_M (~20.4 GB: 18.7 model + 1.2 vision + 0.5 draft/speculative)"
  format: ollama
  parameters: 31B (dense + vision + draft/speculative)
  expected_vram: ~22.1 GB (measured 2026-11-21: 22,021 MiB @ 32K, 22,157 @ 64K, 22,125 @ 128K — Gemma 4 KV is tiny, ~4 MiB/1K tokens)
  context: 64K default (2× the original 32K; measured 2026-11-21 with ~2.3 GB headroom on the 24 GB card); 128K verified loadable if a bigger budget is needed
  fast_option: gemma4:26b (17 GB MoE) — already pulled, faster

launch:
  container: ollama
  image: ollama/ollama:latest
  compose: compose/gemma4-moe.yml  # GPU 1 variant (active since Phase 1; GPU 0 legacy: compose/legacy/compose.gemma4-moe-gpu0.yml)
  port: 11434
  gpu: 1  # device_ids: ['1']
  env:
    OLLAMA_KEEP_ALIVE: "5m"
    OLLAMA_MAX_LOADED_MODELS: "2"

health:
  endpoint: http://localhost:11434/api/tags
  expected_model_name: gemma4:31b

notes:
  - "XOR tenant with media-gpu1 on GPU 1 (keep_alive idle-unload + headroom guard,
    add_card_plan.md §4.1.4; explicit swap: model-manager gpu1 swap copywriter)"
  - "20.4 GB model + tiny KV (Gemma 4 GQA): 64K ctx ≈ 22.1 GB total, ~2.3 GB headroom
    (measured 2026-11-21); 128K verified loadable"
  - "Mutually exclusive with the GPU 0 Ollama compose (compose/gemma4-moe.yml)"
  - "Pull (Phase 0a): state/ollama_pull_gemma4_31b.log; validated on GPU 1 in Phase 1
    (46 s load, ~30 tok/s; reasoning model — needs a generous output budget)"
  - "Open question §7.2 RESOLVED 2026-11-21 (Chuck): 31B confirmed, context flexed
    32K → 64K (128K verified as the ceiling)"