# experiment-qwen38-flash-next-gguf — Experiment 8: Qwen3.8-Flash-Next 125B MoE
# Swift 1.5 IQ4_XS GGUF (UkisAI) via llama.cpp. Primary candidate.
# Compose: compose/experiments/qwen38-flash-next-gguf.yml
#
# Supersedes Experiment 7 (base-model UD-Q4_K_XL 111.3 GB — never downloaded).
# Weights pre-downloaded 2026-10-31 (~98.6 GB, 3 shards + mmproj).

name: qwen38-flash-next-gguf
alias: matrix-coder
backend: llama.cpp
status: ready
experiment: true

model:
  path: /home/chuck/data/models/gguf/IQ4_XS/Swift-1.5-Qwen3.8-Flash-Next-IQ4_XS-00001-of-00003.gguf
  quantization: IQ4_XS (97.7 GB, 3 shards; KLD @32k 0.0929, top-p @32k 88.91%)
  format: GGUF (llama.cpp)
  expected_vram: ~63.5 GB GPU + ~34 GB RAM (mmap)
  parameters: 125B MoE (6B active/token + 51B n-gram embedding PLE + 4B MTP)
  context: 262144
  architecture: "Qwen3.8-Flash-Next (48 layers = 12 x (3 GDN + 1 QSA); only QSA layers carry per-token KV)"

launch:
  container: qwen38-flash-next
  image: ghcr.io/ggml-org/llama.cpp:server-cuda  # CUDA build — plain 'server' tag is CPU-ONLY
  compose: compose/experiments/qwen38-flash-next-gguf.yml
  restart: "no"
  port: 8000
  shm_size: 16g
  volumes:
    - /home/chuck/data/models:/data/models:ro
  args:
    # Full arg list lives in the compose file; key settings:
    - --alias qwen38-27b
    - --ctx-size 262144
    - --parallel 2
    - --cache-type-k q8_0 --cache-type-v q4_0
    - --flash-attn on
    - --mmproj /data/models/gguf/mmproj-Swift-1.5-Qwen3.8-Flash-Next-BF16.gguf

health:
  endpoint: http://localhost:8000/v1/models
  expected_model_name: qwen38-27b

compatible_modes:
  - experiment

notes:
  - Weights downloaded 2026-10-31 — ready to launch
  - 2026-11-14: valid CUDA rerun benchmarked (data/benchmarks/results/20261114_001006) — 291.4 tok/s (2.35× NVFP4 27B baseline), stress 80/80 @4 conc, quality 4/5 solid; long-context inconclusive (harness reads only message.content, misses reasoning_content). See EXPERIMENTS_RESULTS.md Experiment 8.
  - Media pipeline + ComfyUI are stopped automatically by `model-manager experiment start` (~14 GB VRAM): with it running, IQ4_XS at 2x256K is at the RAM wall (62/62 GB); without it, 4x256K fits VRAM. Bring it back with `model-manager media up`.
  - Also stop qwen-coder daily driver (port 8000) — model-manager experiment start does this
  - Let ollama release the GPU (keep_alive 5m idle timeout)
  - Only ONE of the two flash-next experiment files should run at a time (fallback: experiment-qwen38-flash-next-gsq-rco)
  - Expected decode (est.): 2x256K ~60-75 tok/s per session; 4x256K ~50-65 tok/s per session
  - Verify QSA sparse-attention support in llama.cpp first — dense 256K fallback would collapse KV numbers
  - Rollback: model-manager mode rollback (restores qwen-coder.yml on port 8000)