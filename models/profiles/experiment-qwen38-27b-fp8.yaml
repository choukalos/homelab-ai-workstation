# qwen38-27b-fp8 — Qwen3.8-27B FP8 with 128K context, 3 concurrent seqs, vision
# Official Qwen FP8 quantization, hybrid GDN architecture, native vision + MTP
# 3 concurrent sequences, FP8 KV cache, prefix caching, chunked prefill

name: qwen38-27b-fp8
alias: matrix-coder
backend: vllm
status: planned
experiment: true

model:
  path: Qwen/Qwen3.8-27B-FP8
  quantization: FP8 (per-tensor/per-channel, official Qwen build)
  format: HuggingFace native FP8
  expected_vram: 40-50 GB (model + 3x KV @ 128K)
  parameters: 27B dense (no MoE)
  context: 131072
  architecture: "Qwen3_5ForConditionalGeneration (hybrid Gated-DeltaNet + vision)"
  vision: true
  mtp: true
  hybrid_attention:
    gated_delta_net: "48 V heads + 16 QK heads, head_dim=128"
    gated_attention: "24 Q heads + 4 KV heads, head_dim=256, rope_dim=64"
    layers: "64 total — 16 x (3xGDN→FFN, 1xGatedAttention→FFN)"
  ffn_intermediate: 17408

launch:
  container: qwen38-fp8
  image: vllm/vllm-openai:v0.21.0-cu129-ubuntu2404
  compose: compose/experiments/qwen38-27b-fp8.yml
  restart: "no"
  port: 8000
  shm_size: 16g
  volumes:
    - /home/chuck/data/models:/data/models
  env:
    HF_HOME: /data/models
    HF_TOKEN: ""
    HF_XET_HIGH_PERFORMANCE: "1"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  args:
    --model: Qwen/Qwen3.8-27B-FP8
    --served-model-name: qwen38-27b
    --max-model-len: 131072
    --max-num-seqs: 3
    --max-num-batched-tokens: 16384
    --gpu-memory-utilization: 0.92
    --kv-cache-dtype: fp8
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    --chunked-prefill-size: 32768
    --reasoning-parser: qwen3
    --enable-auto-tool-choice: true
    --tool-call-parser: qwen3_coder
    --speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
    --default-chat-template-kwargs: '{"enable_thinking":true,"preserve_thinking":true}'
    --trust-remote-code: true

health:
  endpoint: http://localhost:8000/v1/models
  expected_model_name: qwen38-27b

compatible_modes:
  - experiment

performance_targets:
  concurrent_sequences: 3
  context_window: 128000
  mtp_speedup: "~1.3-1.5x decode with 3 speculative tokens"
  prefix_cache_hit: "30%+ TTFT improvement on repeated system prompts"
  estimated_vram: 40-50 GB of 72 GB

comparison_to_current:
  current_model: Qwen3.6-27B (INT4/W8A16 variants)
  improvements:
    - "Native vision + video understanding (Qwen3.6 is text-only)"
    - "Official FP8 quantization (vs W8A16/INT4 community builds)"
    - "Hybrid GDN architecture (48/64 layers linear attention) for better long context"
    - "Built-in MTP (Multi-Token Prediction) for decode speedup"
    - "Tool calling via qwen3_coder parser (XML-style format, auto-parsed by server)"
    - "Flexible thinking control: reasoning_effort (xhigh/medium/low), preserve_thinking"
    - "Context 128K (from 128K/200K) — same range, better architecture"
  caveats:
    - "Requires vLLM 0.17.0+ for Qwen3.8 hybrid GDN + vision support"
    - "Vision processing requires transformer >= 5.8.0"

notes:
  - "FP8 is the safe/validated path for 72GB — fits with comfortable headroom"
  - "MTP (3 speculative tokens) adds decode throughput without quality loss"
  - "reasoning-parser qwen3: correct parser for Qwen3.8 thinking output"
  - "tool-call-parser qwen3_coder: required for Qwen3.8 XML-style tool calling"
  - "enable_auto_tool_choice: lets model refuse tools when not needed"
  - "For longer context: increase max-model-len up to 262144 (native) with YaRN to 1M"
  - "To disable thinking: set enable_thinking to false in chat_template_kwargs"
  - "Rollback: model-manager mode rollback"