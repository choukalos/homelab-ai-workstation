# comfyui — Image generation & editing (Qwen-Image)
# Status: ACTIVE — runs concurrently with vLLM (no mode switch)
# Updated: 2026-08-26

name: comfyui
alias: none  # no LiteLLM alias — image generation/editing only
backend: comfyui
status: active

model:
  primary:
    create: qwen-image-2512-Q4_0.gguf (Qwen-Image-2512 20B, GGUF Q4_0) + Qwen-Image-2512-Lightning-4steps LoRA, 4 steps
    edit: qwen-image-edit-2511-Q4_0.gguf (Qwen-Image-Edit-2511 20B, GGUF Q4_0) + Qwen-Image-Edit-2511-Lightning-8steps LoRA, 8 steps
  shared:
    text_encoder: qwen_2.5_vl_7b_fp8_scaled.safetensors (9.4 GB)
    vae: qwen_image_vae.safetensors
  fallback:
    create: qwen-image-2512-Q3_K_M.gguf + 8-step Lightning LoRA (if a Q4_0 run OOMs)
  expected_vram: "~12 GB cap (--reserve-vram 60); 9.3-14.4 GB measured peaks; total-GPU peak <= ~71.2 GB"
  docs: docs/matrix_comfyui_media_api.md

launch:
  container: comfyui_backend
  image: mmartial/comfyui-nvidia-docker:latest
  compose: compose/comfyui.yml
  profile: image
  port: 8188
  shm_size: 4gb
  volumes:
    - /home/chuck/data/comfyui/run:/comfy/mnt
    - /home/chuck/data/comfyui/basedir:/basedir
  env:
    COMFYUI_FLAGS: "--listen 0.0.0.0 --port 8188 --fp16-vae --reserve-vram 60"  # reserves 60 GB for other software -> ~12 GB budget
    CUDA_MALLOC_ASYNC: "1"
    SECURITY_LEVEL: weak
    USE_SOCAT: "false"
    USE_UV: "true"
    BASE_DIRECTORY: /basedir
  args: []  # ComfyUI handles its own model loading

health:
  endpoint: http://localhost:8188/system_stats
  note: ComfyUI has no standardized health endpoint; check port responsiveness + comfyui_version

compatible_modes:
  - all  # runs alongside any vLLM/Ollama mode — no exclusivity

mode_requirements:
  must_stop: []  # NONE — vLLM stays online (supersedes old stop-vLLM model)
  must_keep:
    - vLLM (compose/qwen-coder.yml) — matrix-coder stays online
    - Ollama (compose/gemma4-moe.yml) — gemma4 + embeddings
  must_have:
    - compose/metrics.yml — node-exporter and dcgm-exporter (untouched)

security:
  - Do NOT expose port 8188 publicly
  - Internal/LAN access only
  - SECURITY_LEVEL=weak (intentional, internal only)

notes:
  - 2026-08-26: create + edit flows verified end-to-end (VRAM peaks, timing 14-56 s, OCR legibility)
  - Tooling integration contract: docs/matrix_comfyui_media_api.md (endpoints, workflow JSON, reference client)
  - Ops guide: docs/matrix_images_mode.md
  - Models pre-downloaded in basedir/models/ (no HF_TOKEN needed); add files as `comfy` user via `docker exec comfyui_backend sudo -u comfy sh -c '...'`
  - venv for pip: /comfy/mnt/venv (sudo -u comfy)
  - Watch item: Qwen-Image-2.0 open weights (drop-in replacement for node 1 when released)