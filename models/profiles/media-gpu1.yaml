# media-gpu1 — Media pipeline (ComfyUI + media-pipeline) pinned to GPU 1
# Status: DRAFT profile (Phase 3 wires it into the `daily` mode). The compose it
# points at (compose/comfyui.yml) has been the ACTIVE GPU 1 media compose since
# Phase 1 (2026-11-14). The media pipeline runs on GPU 1 (RTX 4000 Blackwell,
# dedicated 24 GB) instead of GPU 0 (shared with vLLM, 14 GB gate).

name: media-gpu1
alias: none  # not an LLM — no LiteLLM alias
backend: media-pipeline
status: draft

model:
  description: >
    ComfyUI (image/video generation) + media-pipeline orchestrator, pinned to GPU 1
    (RTX 4000 Blackwell, 24 GB). Full 24 GB budget (vs the 14 GB gate on GPU 0).
  docs: docs/matrix_media_pipeline_api.md
  expected_vram: up to 24 GB (dedicated GPU 1)

launch:
  container: comfyui_backend
  image: mmartial/comfyui-nvidia-docker:latest
  compose: compose/comfyui.yml  # GPU 1 variant (active since Phase 1; GPU 0 legacy: compose/legacy/compose.comfyui-gpu0.yml)
  profile: image
  port: 8188
  gpu: 1  # device_ids: ['1']
  companion:
    container: media_pipeline
    port: 8189

notes:
  - "Dedicated 24 GB unlocks Phase 6: 720p Wan, better quants (Q6/Q8/FP8), T5-on-GPU,
    both-experts-resident"
  - "No --reserve-vram (GPU 1 is dedicated; the Ollama copywriter unloads on idle)"
  - "Mutually exclusive with the GPU 0 media compose (compose/comfyui.yml)"
  - "QA gate on GPU 1: qa_wan_phase1.py 480 must match GPU 0 parity (Phase 1)"